server:
  port: 8765

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/book-service/**

            - id: exchange-service
              uri: lb://exchange-service
              predicates:
                - Path=/exchange-service/**

management:
  tracing:
    sampling:
      probability: 1.0 # 1.0 == 100%

    export:
      zipkin:
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

springdoc:
  swagger-ui:
    urls:
      - name: book-service
        url: /book-service/v3/api-docs

      - name: exchange-service
        url: /exchange-service/v3/api-docs