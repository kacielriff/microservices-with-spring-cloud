server:
  port: 8100

spring:
  application:
    name: book-service

  datasource:
    url: jdbc:postgresql://localhost:5433/book_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  tracing:
    sampling:
      probability: 1.0 # 1.0 == 100%

    export:
      zipkin:
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  retry:
    instances:
      bookService:
        max-attempts: 5
        wait-duration: 1s
        enable-exponential-backoff: true
#      other-instace:

  rateLimiter:
    instances:
      bookService:
        limit-for-period: 2
        limit-refresh-period: 10s
#      other-instace:

  bulkhead:
    instances:
      bookService:
        max-concurrent-calls: 10
#      other-instace:

springdoc:
  api-docs:
    path: /book-service/v3/api-docs
  swagger-ui:
    url: /book-service/v3/api-docs
  override-server-url: true
